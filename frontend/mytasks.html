<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - ProjeX</title>
    <meta name="description" content="View and manage all your assigned tasks in ProjeX.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="./style/tailwind.css">

    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/main.min.css' rel='stylesheet'>
    <link href='https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.10/main.min.css' rel='stylesheet'>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.10/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        /* Kanban column accent colors */
        .kanban-col-todo     { border-top: 2px solid #64748b; }
        .kanban-col-progress { border-top: 2px solid #06b6d4; }
        .kanban-col-done     { border-top: 2px solid #10b981; }

        .kanban-col-dot.todo     { background: #64748b; }
        .kanban-col-dot.progress { background: #06b6d4; box-shadow: 0 0 8px #06b6d4; }
        .kanban-col-dot.done     { background: #10b981; box-shadow: 0 0 8px #10b981; }

        /* Table empty state */
        .empty-row td {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        /* Calendar wrapper */
        .calendar-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 600px;
        }

        /* Tab views */
        #table-view, #kanban-view, #calendar-view {
            animation: fadeSlideUp 0.3s ease both;
        }
    </style>
</head>

<body>
    <!-- Background Orbs -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
    </div>

    <div class="app-layout">
        <!-- ═══ Sidebar ═══ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>
                        </svg>
                    </div>
                    <span class="sidebar-logo-text">ProjeX</span>
                </div>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <p class="nav-title">Selected Project</p>
                <div id="selected-project-name" class="workspace-info">No project selected</div>

                <p class="nav-title">Menu</p>
                <ul>
                    <li>
                        <a href="index.html">
                            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                            </svg>
                            Home
                        </a>
                    </li>
                    <li class="active">
                        <a href="mytasks.html">
                            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                            </svg>
                            My Tasks
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Members
                        </a>
                    </li>
                    <li>
                        <a href="settings.html" id="settings-link">
                            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Settings
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- ═══ Main Content ═══ -->
        <main class="main-content" style="position:relative;z-index:1;">
            <!-- Header -->
            <header class="main-header">
                <div>
                    <h1>My Tasks</h1>
                    <p class="header-subtitle">All tasks assigned to you across projects.</p>
                </div>
                <div id="profile-btn" class="profile-circle" role="button" tabindex="0" aria-label="User profile">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
            </header>

            <!-- Tab Navigation -->
            <div style="padding: 1.5rem 2rem 0;">
                <div class="tab-nav" role="tablist">
                    <button id="tab-table" class="tab-btn active" role="tab" aria-selected="true" aria-controls="table-view">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="display:inline;margin-right:4px;vertical-align:-2px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M10 4h4M10 20h4"/>
                        </svg>
                        Table
                    </button>
                    <button id="tab-kanban" class="tab-btn" role="tab" aria-selected="false" aria-controls="kanban-view">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="display:inline;margin-right:4px;vertical-align:-2px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
                        </svg>
                        Kanban
                    </button>
                    <button id="tab-calendar" class="tab-btn" role="tab" aria-selected="false" aria-controls="calendar-view">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="display:inline;margin-right:4px;vertical-align:-2px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        Calendar
                    </button>
                </div>
            </div>

            <!-- Table View -->
            <section id="table-view" style="padding: 1.5rem 2rem 2rem;" role="tabpanel" aria-labelledby="tab-table">
                <div class="table-container">
                    <table class="tasks-table" aria-label="My tasks">
                        <thead>
                            <tr>
                                <th>Task Name</th>
                                <th>Project</th>
                                <th>Assignees</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="my-tasks-tbody">
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Kanban View -->
            <section id="kanban-view" class="hidden" style="padding: 1.5rem 2rem 2rem;" role="tabpanel" aria-labelledby="tab-kanban">
                <div class="kanban-board" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
                    <!-- To Do -->
                    <div class="kanban-column kanban-col-todo">
                        <div class="kanban-column-header">
                            <span class="kanban-col-dot todo"></span>
                            <h3>To Do</h3>
                            <span class="kanban-count" id="todo-count">0</span>
                        </div>
                        <div id="kanban-todo" class="kanban-list" data-status="To Do"></div>
                    </div>

                    <!-- In Progress -->
                    <div class="kanban-column kanban-col-progress">
                        <div class="kanban-column-header">
                            <span class="kanban-col-dot progress"></span>
                            <h3>In Progress</h3>
                            <span class="kanban-count" id="inprogress-count">0</span>
                        </div>
                        <div id="kanban-inprogress" class="kanban-list" data-status="In Progress"></div>
                    </div>

                    <!-- Done -->
                    <div class="kanban-column kanban-col-done">
                        <div class="kanban-column-header">
                            <span class="kanban-col-dot done"></span>
                            <h3>Done</h3>
                            <span class="kanban-count" id="done-count">0</span>
                        </div>
                        <div id="kanban-done" class="kanban-list" data-status="Done"></div>
                    </div>
                </div>
            </section>

            <!-- Calendar View -->
            <section id="calendar-view" class="hidden" style="padding: 1.5rem 2rem 2rem;" role="tabpanel" aria-labelledby="tab-calendar">
                <div class="calendar-wrap">
                    <div id="calendar" style="min-height: 680px; padding: 1rem;"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title-tasks">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="profile-title-tasks">Your Profile</h2>
                <span class="close-btn profile-close" role="button" aria-label="Close">&times;</span>
            </div>
            <div class="modal-body">
                <div style="display:flex;flex-direction:column;gap:0.75rem;margin-bottom:1.25rem;">
                    <div class="profile-row">
                        <svg class="profile-row-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <div>
                            <p class="profile-row-label">Username</p>
                            <p class="profile-row-value" id="profile-username"></p>
                        </div>
                    </div>
                    <div class="profile-row">
                        <svg class="profile-row-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                        </svg>
                        <div>
                            <p class="profile-row-label">Email</p>
                            <p class="profile-row-value" id="profile-email"></p>
                        </div>
                    </div>
                </div>
                <button id="logout-btn" class="btn btn-danger" style="width:100%;justify-content:center;">Logout</button>
            </div>
        </div>
    </div>

    <script src="./scripts/app.js" defer></script>
    <script src="./scripts/kanban.js"></script>
    <script src="./scripts/calendar.js" defer></script>
    <script>
        // ─── Tab switching ───
        const tabs = ['table', 'kanban', 'calendar'];
        tabs.forEach(tab => {
            document.getElementById(`tab-${tab}`)?.addEventListener('click', () => {
                tabs.forEach(t => {
                    document.getElementById(`tab-${t}`).classList.remove('active');
                    document.getElementById(`tab-${t}`).setAttribute('aria-selected', 'false');
                    const view = document.getElementById(`${t}-view`);
                    if (view) view.classList.add('hidden');
                });
                document.getElementById(`tab-${tab}`).classList.add('active');
                document.getElementById(`tab-${tab}`).setAttribute('aria-selected', 'true');
                const view = document.getElementById(`${tab}-view`);
                if (view) view.classList.remove('hidden');
            });
        });

        // ─── Fetch My Tasks ───
        const myTasksTableBody = document.getElementById("my-tasks-tbody");
        if (myTasksTableBody) {
            fetchMyTasks();
        }

        async function fetchMyTasks() {
            console.log("1. Starting to fetch tasks...");
            const authToken = localStorage.getItem("authToken");
            const selectedProjectId = localStorage.getItem("selectedProjectId");

            try {
                let url = "http://127.0.0.1:8000/api/mytasks/";
                if (selectedProjectId) {
                    url = `http://127.0.0.1:8000/api/mytasks/?project_id=${selectedProjectId}`;
                }
                const response = await fetch(url, {
                    headers: { Authorization: `Token ${authToken}` },
                });
                if (!response.ok) throw new Error("Could not fetch your tasks.");

                const tasks = await response.json();
                window.myTasksData = tasks;
                displayMyTasks(tasks);
            } catch (error) {
                console.error("Error during fetch:", error);
                const tableBody = document.getElementById("my-tasks-tbody");
                if (tableBody) {
                    const row = tableBody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = error.message;
                    cell.style.textAlign = "center";
                    cell.style.color = "var(--text-muted)";
                    cell.style.padding = "3rem";
                }
            }
        }
    </script>
</body>

</html>

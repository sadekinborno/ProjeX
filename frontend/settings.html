<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Settings - ProjeX</title>
    <link rel="stylesheet" href="./style/tailwind.css">
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ProjeX</h2>
            </div>
            <nav class="sidebar-nav">
                <p class="nav-title">SELECTED PROJECT</p>
                <div id="selected-project-name" class="workspace-info">
                    No project selected
                </div>

                <p class="nav-title">MENU</p>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="mytasks.html">My Tasks</a></li>
                    <li><a href="#">Members</a></li>
                    <li class="active"><a href="settings.html">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content bg-gray-50 min-h-screen">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Project Settings</h1>
                    <a href="index.html" class="text-gray-600 hover:text-gray-800">← Back to Dashboard</a>
                </div>
            </header>

            <!-- Settings Sections -->
            <div class="max-w-4xl mx-auto py-8 px-4 space-y-8">
                <!-- Project Details Section -->
                <section class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-6">Project Details</h2>
                    <form id="project-details-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                                <input type="text" id="project-name"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Project Type</label>
                                <input type="text" id="project-type"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-6 space-x-4">
                            <div class="flex space-x-4">
                                <button type="submit"
                                    class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-all">
                                    Save Changes
                                </button>
                            </div>
                            <button type="button" id="delete-project-btn"
                                class="inline-block bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition-all">
                                Delete Project
                            </button>
                        </div>
                    </form>
                </section>

                <!-- Task Management Section -->
                <section class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-6">Task Management</h2>

                    <!-- Existing Tasks List -->
                    <div class="mb-6">
                        <h3 class="text-lg font-medium mb-3">Existing Tasks</h3>
                        <div id="tasks-list" class="space-y-2 max-h-96 overflow-y-auto">
                            <p class="text-gray-500 text-sm">Loading tasks...</p>
                        </div>
                    </div>

                    <hr class="my-6">

                    <!-- Create/Edit Task Form -->
                    <h3 class="text-lg font-medium mb-3" id="form-title">Create New Task</h3>
                    <form id="task-settings-form" class="space-y-4">
                        <input type="hidden" id="task-id" value="">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Task Title <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="task-title" required
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                                    placeholder="Enter task title">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Task Status</label>
                                <select id="task-section"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="To Do">To Do</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Done">Done</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Priority Level</label>
                                <select id="task-priority"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                                <textarea id="task-description" rows="3"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                                    placeholder="Task description (optional)"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Assignee</label>
                                <select id="task-assignee"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                                    <option value="" disabled selected>Loading members...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                                <input type="date" id="task-due-date"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div class="flex space-x-3">
                            <button type="submit" id="task-submit-btn"
                                class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 mt-4">Create
                                Task</button>
                            <button type="button" id="task-cancel-btn"
                                class="bg-gray-400 text-white px-4 py-2 rounded-lg hover:bg-gray-500 mt-4 hidden">Cancel</button>
                        </div>
                    </form>
                </section>

                <!-- Project Timeline Section -->
                <section class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-6">Project Timeline</h2>
                    <form id="timeline-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Project Start Date</label>
                                <input type="date" id="project-start-date"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Project End Date</label>
                                <input type="date" id="project-end-date"
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <button type="submit"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 mt-4">Update
                            Timeline</button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="./scripts/app.js"></script>
</body>

</html>

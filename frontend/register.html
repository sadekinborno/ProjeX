<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ProjeX</title>
    <meta name="description" content="Create your ProjeX account and start managing projects like a pro.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/register-animation.css">

    <style>
        body.auth-page {
            position: relative;
            overflow: hidden;
        }

        /* Grid background */
        .auth-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(139,92,246,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139,92,246,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Auth Card */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(15, 22, 41, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.12);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .auth-card-header {
            padding: 2rem 2rem 1.5rem;
            background: linear-gradient(135deg, rgba(139,92,246,0.15) 0%, rgba(99,102,241,0.1) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .auth-logo {
            width: 60px; height: 60px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 6px rgba(139,92,246,0.15), 0 8px 24px rgba(139,92,246,0.4);
            position: relative;
            z-index: 1;
        }

        .auth-title {
            font-size: 1.625rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            position: relative;
            z-index: 1;
        }

        .auth-subtitle {
            font-size: 0.825rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            position: relative;
            z-index: 1;
        }

        .auth-card-body { padding: 1.75rem 2rem; }

        /* Input with icon */
        .input-wrapper { position: relative; }

        .input-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color var(--transition-fast);
        }

        .input-wrapper:focus-within .input-icon { color: #c4b5fd; }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm);
            padding: 0.75rem 0.875rem 0.75rem 2.75rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
            transition: all var(--transition-normal);
        }

        .input-field:focus {
            border-color: rgba(139,92,246,0.6);
            background: rgba(139,92,246,0.06);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
        }

        .input-field::placeholder { color: var(--text-muted); }
        .input-field-right { padding-right: 2.75rem; }

        .pw-toggle {
            position: absolute;
            right: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            transition: color var(--transition-fast);
        }

        .pw-toggle:hover { color: var(--text-secondary); }

        /* Password strength */
        .strength-bars {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .strength-bar {
            flex: 1;
            height: 3px;
            border-radius: 99px;
            background: rgba(255,255,255,0.08);
            transition: background var(--transition-normal);
        }

        .strength-bar.active-1 { background: #f43f5e; }
        .strength-bar.active-2 { background: #f59e0b; }
        .strength-bar.active-3 { background: #06b6d4; }
        .strength-bar.active-4 { background: #10b981; }

        #password-strength-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Terms */
        .terms-wrap {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .terms-wrap input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #8b5cf6;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-link {
            color: #c4b5fd;
            text-decoration: none;
        }

        .terms-link:hover { text-decoration: underline; }

        /* Submit button */
        .auth-submit {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.875rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: all var(--transition-normal);
            box-shadow: 0 4px 20px rgba(139,92,246,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139,92,246,0.55);
        }

        .auth-submit:active { transform: scale(0.98); }
        .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .auth-card-footer {
            padding: 1.25rem 2rem 1.75rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }

        .auth-link {
            color: #c4b5fd;
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-fast);
        }

        .auth-link:hover { color: #a78bfa; text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.07);
        }

        .social-btns {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .social-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }

        /* Loading overlay */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 22, 41, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #loading-overlay.flex { display: flex; }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(139,92,246,0.3);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
    </style>
</head>

<body class="auth-page">
    <!-- Background -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="bg-orb bg-orb-1" style="background:radial-gradient(circle,#8b5cf6,#6366f1)"></div>
        <div class="bg-orb bg-orb-2" style="background:radial-gradient(circle,#6366f1,#06b6d4)"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="auth-grid" aria-hidden="true"></div>

    <!-- Auth Card -->
    <div class="auth-card" role="main" style="position:relative;">
        <div class="auth-card-header">
            <div class="auth-logo" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="auth-title">Join ProjeX!</h1>
            <p class="auth-subtitle">Create your account to get started</p>
        </div>

        <div class="auth-card-body">
            <form id="register-form" novalidate>
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" required
                            class="input-field" placeholder="Choose a username" autocomplete="username">
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" required
                            class="input-field" placeholder="Enter your email" autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" required
                            class="input-field input-field-right" placeholder="Create a strong password" autocomplete="new-password">
                        <button type="button" id="toggle-password" class="pw-toggle" aria-label="Toggle password visibility">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Strength indicator -->
                    <div class="strength-bars">
                        <div class="strength-bar" id="strength-1"></div>
                        <div class="strength-bar" id="strength-2"></div>
                        <div class="strength-bar" id="strength-3"></div>
                        <div class="strength-bar" id="strength-4"></div>
                    </div>
                    <p id="password-strength-text">Password strength</p>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </span>
                        <input type="password" id="confirm-password" name="confirm-password" required
                            class="input-field" placeholder="Confirm your password" autocomplete="new-password">
                    </div>
                </div>

                <!-- Terms -->
                <div style="margin-bottom:1.5rem;">
                    <label class="terms-wrap">
                        <input type="checkbox" id="terms" required>
                        <span>
                            I agree to the
                            <a href="#" class="terms-link">Terms of Service</a>
                            and
                            <a href="#" class="terms-link">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="auth-submit" id="register-btn">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                    Create Account
                </button>

                <div id="error-message" class="error-text" style="margin-top:0.875rem;"></div>
            </form>
        </div>

        <div class="auth-card-footer">
            <p style="font-size:0.825rem;color:var(--text-muted);">
                Already have an account?
                <a href="login.html" class="auth-link">Sign In</a>
            </p>
            <div class="divider">or continue with</div>
            <div class="social-btns">
                <button class="social-btn" aria-label="Sign up with Twitter">
                    <svg width="18" height="18" fill="#1d9bf0" viewBox="0 0 24 24">
                        <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                    </svg>
                </button>
                <button class="social-btn" aria-label="Sign up with Facebook">
                    <svg width="18" height="18" fill="#1877f2" viewBox="0 0 24 24">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>
                <button class="social-btn" aria-label="Sign up with Google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay">
            <div style="display:flex;align-items:center;gap:0.875rem;">
                <div class="spinner"></div>
                <span style="color:#c4b5fd;font-weight:600;font-size:0.875rem;">Creating your account...</span>
            </div>
        </div>
    </div>

    <script src="./scripts/app.js" defer></script>
    <script src="scripts/register-animation.js"></script>
</body>

</html>
